name: Verify GiwaLearnRewards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compile production artifacts
        run: pnpm exec hardhat --build-profile production compile

      - name: Verify on GIWA Sepolia Blockscout
        run: >-
          pnpm exec hardhat
          --network giwaSepolia
          --build-profile production
          verify blockscout
          --contract contracts/GiwaLearnRewards.sol:GiwaLearnRewards
          0x22acb03CaB80Caaff541B39b1eEeBF374E02C9Ca
          0x985E8D68cF4B02d5c476191D446f1dB8a1D0c71E
          0x985E8D68cF4B02d5c476191D446f1dB8a1D0c71E
          0x985E8D68cF4B02d5c476191D446f1dB8a1D0c71E
          0xd5077b67dcb56caC8b270C7788FC3E6ee03F17B9
          0xaa92f8c143657dde575de430aecaea6ca91f2e6072339b16932d426895d8d678
